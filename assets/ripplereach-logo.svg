<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- RippleReach: a pointer sending out ripples — reach out and work on another machine.
       Variants: app-icon-small.svg (16–32 px), app-icon-mac.svg (macOS grid). Rebuild the
       icon set with `node scripts/build-icons.mjs`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C6B4"/>
      <stop offset="1" stop-color="#1463F3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="230" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="230" fill="url(#glow)"/>
  <!-- Ripples around the pointer's tip (372, 372), opening towards the pointer. -->
  <path d="M346.0 519.7 A150 150 0 1 1 519.7 346.0" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="60" stroke-linecap="round"/>
  <path d="M325.5 635.9 A268 268 0 1 1 635.9 325.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="60" stroke-linecap="round"/>
  <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" transform="translate(271.1 254.8) scale(25)" fill="#ffffff" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round" filter="url(#lift)"/>
</svg>
